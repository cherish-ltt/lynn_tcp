# Prometheus configuration for Lynn TCP monitoring
#
# Place this file in your Prometheus directory and start Prometheus with:
# prometheus --config.file=prometheus.yml

global:
  scrape_interval: 10s  # Scrape targets every 10 seconds
  evaluation_interval: 10s  # Evaluate rules every 10 seconds
  external_labels:
    cluster: 'lynn_tcp_cluster'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - localhost:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Lynn TCP metrics endpoint
  - job_name: 'lynn_tcp'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9091  # Lynn TCP metrics endpoint
        labels:
          service: 'lynn_tcp_server'
          env: 'production'

  # Prometheus self-monitoring (optional but recommended)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

