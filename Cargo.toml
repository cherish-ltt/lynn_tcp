[package]
name = "lynn_tcp"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
authors = ["lynn_tcp Contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cherish-ltt/lynn_tcp"
description = "Lightweight asynchronous TCP framework"
categories = ["network-programming"]
keywords = ["tcp" , "tcp-server" , "tcp-client" , "network" , "lynn"]

[dependencies]
bytes = "=1.11.1"
crossbeam-deque = "=0.8.6"
dashmap = "6.2.1"
tokio = { version = "=1.52.3", features = ["macros","net","sync","rt-multi-thread","time","io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.18"
anyhow = "1.0.102"
socket2 = "0.6.3"
prometheus = "0.14.0"
lazy_static = "1.5"

[features]
default=["server","client"]
server=["metrics"]
client=[]

metrics=[]
