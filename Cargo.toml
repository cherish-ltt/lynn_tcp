[package]
name = "lynn_tcp"
version = "2.6.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["lynn_tcp Contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/cherish-ltt/lynn_tcp"
description = "Lightweight asynchronous TCP framework with optional KCP transport"
categories = ["network-programming"]
keywords = ["tcp" , "tcp-server" , "tcp-client" , "network" , "lynn"]

# 异步运行时
[dependencies]
tokio = { version = "=1.52.3", features = ["macros","net","sync","rt-multi-thread","time","io-util"] }

# 可选：KCP 传输（使用底层控制块，不使用高层消息监听器）
kcp-ovo = { version = "=0.8.0", default-features = false, optional = true }

# 数据结构与并发容器
bytes = "=1.11.1"
crossbeam-deque = "=0.8.8"
dashmap = "=6.2.1"
lazy_static = "=1.5.0"

# 网络与 Socket
socket2 = "=0.6.5"

# 日志追踪
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

# 错误处理
thiserror = "=2.0.20"
anyhow = "=1.0.104"

# 指标监控
prometheus = "=0.14.0"

# 可选：TLS 1.3 传输加密（feature = "tls"，默认关闭）
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"], optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "logging"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }

# 可选：SeaORM 数据库句柄（feature = "seaorm"，默认关闭）
sea-orm = { version = "=2.0.3", default-features = false, features = ["runtime-tokio-rustls", "macros"], optional = true }

[features]
default=["server","client"]
server=["metrics"]
client=[]

metrics=[]
kcp=["dep:kcp-ovo"]
kcp-tls=["kcp", "tls"]

# TLS 1.3 传输加密（默认关闭，需配置证书并手动开启）
tls=["dep:tokio-rustls","dep:rustls","dep:rustls-pemfile"]

# SeaORM 数据库句柄内置支持（默认关闭）
seaorm=["dep:sea-orm"]

# 测试与示例专用依赖
[dev-dependencies]
# 虚拟时钟回归测试
tokio = { version = "=1.52.3", features = ["test-util"] }
# TLS 集成测试与示例用的临时证书生成
rcgen = "=0.14.10"
# 基准测试中提升/检查文件描述符上限
libc = "=0.2.189"

# 按需编译的示例（依赖可选 feature）
[[example]]
name = "basic_server"
required-features = ["server"]

[[example]]
name = "client_connection_state"
required-features = ["client"]

[[example]]
name = "graceful_shutdown"
required-features = ["server"]

[[example]]
name = "background_broadcast"
required-features = ["server"]

[[example]]
name = "session_push"
required-features = ["server", "client"]

[[example]]
name = "custom_config_server"
required-features = ["server"]

[[example]]
name = "custom_protocol"
required-features = ["server"]

[[example]]
name = "custom_protocol_full"
required-features = ["server", "client"]

[[example]]
name = "echo_server_client"
required-features = ["server", "client"]

[[example]]
name = "metrics_example"
required-features = ["server"]

[[example]]
name = "multi_route_service"
required-features = ["server", "client"]

[[example]]
name = "state_example"
required-features = ["server", "client"]

[[example]]
name = "middleware_example"
required-features = ["server", "client"]

[[example]]
name = "middleware_bench_server"
required-features = ["server"]

[[example]]
name = "tls_example"
required-features = ["server", "client", "tls"]

# 集成测试只在所需角色启用时编译和运行
[[test]]
name = "client_reconnect"
required-features = ["client"]

[[test]]
name = "custom_protocol_marks"
required-features = ["server", "client"]

[[test]]
name = "server_client_integration"
required-features = ["server", "client"]

[[test]]
name = "state_injection"
required-features = ["server"]

[[test]]
name = "session_handles"
required-features = ["server"]

[[test]]
name = "middleware_core"
required-features = ["server"]

[[test]]
name = "middleware_lifecycle"
required-features = ["server"]

[[test]]
name = "middleware_metrics"
required-features = ["server"]

[[test]]
name = "middleware_transport"
required-features = ["server"]

[[test]]
name = "tls_integration"
required-features = ["server", "client", "tls"]

[[test]]
name = "kcp_tls_transport"
required-features = ["server", "client", "kcp-tls"]

[[test]]
name = "readme_kcp_tls_config"
required-features = ["server", "client", "kcp-tls"]

[[bin]]
name = "bench_echo_server"
required-features = ["server"]

# 标准化网络基准（harness=false，自管理 CLI 与计时）
[[bench]]
name = "benchmark"
harness = false
required-features = ["server", "client"]

# 编译优化配置
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "kcp_echo"
required-features = ["client", "server", "kcp"]
