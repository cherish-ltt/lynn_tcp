[package]
name = "lynn_tcp"
version = "1.2.5"
edition = "2024"
rust-version = "1.92"
authors = ["lynn_tcp Contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cherish-ltt/lynn_tcp"
description = "Lightweight asynchronous TCP framework"
categories = ["network-programming"]
keywords = ["tcp" , "tcp-server" , "tcp-client" , "network" , "lynn"]

[dependencies]
bytes = "=1.10.1"
crossbeam-deque = "=0.8.6"
dashmap = "6.1.0"
tokio = { version = "=1.47.1", features = ["macros","net","sync","rt-multi-thread","time","io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
anyhow = "1.0"
socket2 = "0.5"
prometheus = "0.13"
lazy_static = "1.5"

[features]
default=["server","client"]
server=["metrics"]
client=[]

metrics=[]
