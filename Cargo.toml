[package]
name = "lynn_tcp"
version = "2.0.0-rc.3"
edition = "2024"
rust-version = "1.98.1"
authors = ["lynn_tcp Contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/cherish-ltt/lynn_tcp"
description = "Lightweight asynchronous TCP framework"
categories = ["network-programming"]
keywords = ["tcp" , "tcp-server" , "tcp-client" , "network" , "lynn"]

# 异步运行时
[dependencies]
tokio = { version = "=1.53.1", features = ["macros","net","sync","rt-multi-thread","time","io-util"] }

# 数据结构与并发容器
bytes = "=1.12.1"
crossbeam-deque = "=0.8.7"
dashmap = "=6.2.1"
lazy_static = "=1.5.0"

# 网络与 Socket
socket2 = "=0.6.5"

# 日志追踪
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

# 错误处理
thiserror = "=2.0.20"
anyhow = "=1.0.104"

# 指标监控
prometheus = "=0.14.0"

# 可选：TLS 1.3 传输加密（feature = "tls"，默认关闭）
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"], optional = true }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "logging"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }

# 可选：SeaORM 数据库句柄（feature = "seaorm"，默认关闭）
sea-orm = { version = "=2.0.2", default-features = false, features = ["runtime-tokio-rustls", "macros"], optional = true }

[features]
default=["server","client"]
server=["metrics"]
client=[]

metrics=[]

# TLS 1.3 传输加密（默认关闭，需配置证书并手动开启）
tls=["dep:tokio-rustls","dep:rustls","dep:rustls-pemfile"]

# SeaORM 数据库句柄内置支持（默认关闭）
seaorm=["dep:sea-orm"]

# 测试与示例专用依赖
[dev-dependencies]
# TLS 集成测试与示例用的临时证书生成
rcgen = "=0.14.10"
# 基准测试中提升/检查文件描述符上限
libc = "=0.2.189"

# 按需编译的示例（依赖可选 feature）
[[example]]
name = "tls_example"
required-features = ["tls"]

# 标准化网络基准（harness=false，自管理 CLI 与计时）
[[bench]]
name = "benchmark"
harness = false

# 编译优化配置
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
